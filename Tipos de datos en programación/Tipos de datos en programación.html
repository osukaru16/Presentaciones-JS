<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tipos de datos en programación</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1b1e2b;--mut:#5d6378;--bd:#dde1ee;--code:#eef0f8;--acc:#4f46e5;--ok:#16a34a;--ko:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c2f;--ink:#eceefb;--mut:#9aa1c0;--bd:#2a3050;--code:#0d1020;--acc:#9aa1ff;--ok:#4ade80;--ko:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c2f;--ink:#eceefb;--mut:#9aa1c0;--bd:#2a3050;--code:#0d1020;--acc:#9aa1ff;--ok:#4ade80;--ko:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;transition:background .3s,color .3s}
header,footer{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--bd)}
footer{border:0;border-top:1px solid var(--bd);justify-content:space-between}
header b{flex:1;font-size:15px}
#bar{height:3px;background:var(--acc);width:0;transition:width .3s}
button{font:inherit;color:inherit;cursor:pointer}
.ic,.nav{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:6px 12px}
.nav{background:var(--acc);color:#fff;border:0;padding:8px 18px;font-weight:600}
.nav:disabled{opacity:.35;cursor:default}
#stage{flex:1;overflow:auto;padding:22px 18px}
.slide{max-width:900px;margin:0 auto;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:clamp(26px,5vw,42px);margin:.2em 0}
h2{font-size:clamp(22px,4vw,32px);margin:.2em 0}
.lead{color:var(--mut);font-size:1.1em}
.big{font-size:44px;line-height:1}
.hd{display:flex;gap:14px;align-items:center}
.hd .big{background:color-mix(in srgb,var(--acc) 15%,transparent);border-radius:16px;padding:12px 16px;font-family:ui-monospace,monospace;font-size:28px;color:var(--acc)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 10px}
.tab{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 14px}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
pre{background:var(--code);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;overflow-x:auto;margin:0;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
.note{background:var(--card);border-left:4px solid var(--acc);border-radius:8px;padding:10px 14px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:left}
button.card:hover,.chip:hover{border-color:var(--acc)}
button.card.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.chip{display:inline-block;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:3px 12px;margin:3px 4px 3px 0;font-size:14px}
code{font-family:ui-monospace,monospace;color:var(--acc)}
table{width:100%;border-collapse:collapse;margin-top:12px}
td{border-top:1px solid var(--bd);padding:8px 6px;vertical-align:top;font-size:14px}
td:first-child{font-weight:700;white-space:nowrap}
input{width:100%;font:16px ui-monospace,monospace;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--ink)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 15%,transparent)}
.res.ok{color:var(--ok)}.res.ko{color:var(--ko)}
#dots{display:flex;gap:6px}
#dots i{width:9px;height:9px;border-radius:50%;background:var(--bd);cursor:pointer}
#dots i.on{background:var(--acc);transform:scale(1.4)}
@media(max-width:640px){#dots{display:none}}
</style>
</head>
<body>
<header><b>🧬 Tipos de datos</b><span id="cnt" class="lead"></span><button class="ic" id="th" aria-label="Cambiar tema">🌙</button></header>
<div id="bar"></div>
<main id="stage"></main>
<footer><button class="nav" id="pv">← Anterior</button><div id="dots"></div><button class="nav" id="nx">Siguiente →</button></footer>

<script>
const D=JSON.parse(document.getElementById('data').textContent),L=D.langs,K=Object.keys(L),S=D.slides,stage=document.getElementById('stage');
let i=0,lang='py',cmp=false,mode=null,dom=0,val='42',qa=[],root=document.documentElement;
try{lang=localStorage.getItem('lang')||'py'}catch(e){}
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pre=c=>`<pre><code style="color:inherit">${esc(c)}</code></pre>`;
function tabs(cur,cb){const d=el('div','tabs');K.forEach(k=>{const b=el('button','tab'+(k===cur?' on':''),L[k]);b.onclick=()=>cb(k);d.append(b)});return d}
function setLang(k){lang=k;try{localStorage.setItem('lang',k)}catch(e){}show(true)}
const R={
intro(v,s){v.innerHTML=`<div class="big">🧬</div><h1>${s.title}</h1><p class="lead">${s.text}</p><div class="grid">${s.how.map(h=>`<div class="card">${h}</div>`).join('')}</div><h2 style="margin-top:28px">Índice</h2>`;
 const c=el('div');S.forEach((x,j)=>{if(j){const b=el('button','chip',x.title);b.onclick=()=>go(j);c.append(b)}});v.append(c)},
type(v,s){v.innerHTML=`<div class="hd"><div class="big">${s.icon}</div><div><h2>${s.title}</h2><p class="lead" style="margin:0">${s.desc}</p></div></div>`;
 const t=el('div','tabs');t.append(...tabs(lang,setLang).children);const b=el('button','tab'+(cmp?' on':''),'⇄ Comparar todos');b.onclick=()=>{cmp=!cmp;show(true)};t.append(b);v.append(t);
 if(cmp){v.insertAdjacentHTML('beforeend','<table>'+K.map(k=>`<tr><td>${L[k]}</td><td><code style="white-space:pre-wrap">${esc(s.code[k])}</code><br><span class="lead" style="font-size:13px">${s.note[k]}</span></td></tr>`).join('')+'</table>')}
 else{v.insertAdjacentHTML('beforeend',pre(s.code[lang])+`<div class="note">💡 <b>${L[lang]}:</b> ${s.note[lang]}</div>`)}},
typing(v,s){v.innerHTML=`<h2>${s.title}</h2><p class="lead">${s.text}</p>`;const t=el('div','tabs');
 Object.entries(s.modes).forEach(([k,m])=>{const b=el('button','tab'+(mode===k?' on':''),m.label);b.onclick=()=>{mode=k;show(true)};t.append(b)});v.append(t);
 if(mode){const m=s.modes[mode];v.insertAdjacentHTML('beforeend',pre(m.code)+`<div class="note res ${m.ok?'ok':'ko'}">${m.res}</div>`)}},
exclusive(v,s){v.innerHTML=`<h2>${s.title}</h2><p class="lead">Elige un lenguaje y descubre qué tiene que otros no.</p>`;v.append(tabs(lang,setLang));
 v.insertAdjacentHTML('beforeend','<div class="grid">'+s.list[lang].map(x=>`<div class="card"><b><code>${esc(x.t)}</code></b><br>${x.d}</div>`).join('')+'</div>')},
domains(v,s){v.innerHTML=`<h2>${s.title}</h2><p class="lead">Toca un ámbito.</p>`;const g=el('div','grid');
 s.items.forEach((x,j)=>{const b=el('button','card'+(j===dom?' on':''),`<div class="big" style="font-size:30px">${x.i}</div><b>${x.n}</b>`);b.onclick=()=>{dom=j;show(true)};g.append(b)});v.append(g);
 const x=s.items[dom];v.insertAdjacentHTML('beforeend',`<div class="note"><b>${x.n}:</b> ${x.t}<div style="margin-top:8px">${x.c.map(c=>`<span class="chip"><code>${esc(c)}</code></span>`).join('')}</div></div>`)},
detector(v,s){v.innerHTML=`<h2>${s.title}</h2><p class="lead">${s.text}</p>`;const inp=el('input');inp.value=val;inp.placeholder='Ej.: 42, 3.14, true, "hola", null, [1,2,3]…';v.append(inp);
 const ex=el('div','tabs');s.ex.forEach(e=>{const b=el('button','chip',esc(e));b.onclick=()=>{val=e;inp.value=e;out()};ex.append(b)});v.append(ex);const o=el('div');v.append(o);
 function out(){val=inp.value;const t=val.trim();if(!t){o.innerHTML='';return}
  const k=/^-?\d+$/.test(t)?'entero':/^-?\d*[.,]\d+$/.test(t)?'decimal':/^(true|false)$/i.test(t)?'booleano':/^(null|none|nil|undefined)$/i.test(t)?'nulo':/^\[.*\]$/.test(t)?'lista':/^\{.*\}$/.test(t)?'mapa':'texto';
  const ty=s.types[k];o.innerHTML=`<p>Detectado: <b style="color:var(--acc)">${k}</b></p><div class="grid">`+K.map(l=>{
   let d;if(['lista','mapa','nulo'].includes(k)){d=S.find(x=>x.id===k).code[l]}else{let x=t;if(k==='decimal')x=t.replace(',','.');if(k==='booleano'){x=t.toLowerCase();if(l==='py')x=x[0].toUpperCase()+x.slice(1)}if(k==='texto')x='"'+t.replace(/^["']|["']$/g,'')+'"';d=s.tpl[l].replace('{T}',ty[l]).replace('{v}',x)}
   return `<div class="card"><b>${L[l]}</b> · <code>${esc(ty[l])}</code>${pre(d).replace('<pre>','<pre style="margin-top:8px">')}</div>`}).join('')+'</div>'}
 inp.oninput=out;out()},
quiz(v,s){v.innerHTML=`<h2>${s.title}</h2>`;let sc=0;s.q.forEach((q,n)=>{const c=el('div','card');c.style.margin='12px 0';c.innerHTML=`<b>${n+1}. ${q.q}</b>`;
  q.o.forEach((t,j)=>{const b=el('button','opt',esc(t));b.onclick=()=>{if(qa[n]!=null)return;qa[n]=j;show(true)};
   if(qa[n]!=null){b.classList.add(j===q.a?'ok':j===qa[n]?'ko':'x')}c.append(b)});
  if(qa[n]!=null){if(qa[n]===q.a)sc++;c.insertAdjacentHTML('beforeend',`<div class="lead">${qa[n]===q.a?'✅':'❌'} ${q.w}</div>`)}v.append(c)});

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Front-end, Back-end y Fullstack</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#5b6478;--accent:#4f46e5;--accent2:#0ea5e9;--border:#e1e5ef;--code-bg:#0f172a;--code-text:#e2e8f0;--front:#ec4899;--back:#10b981;--full:#f59e0b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151b2e;--text:#eef1f8;--muted:#a3adc4;--accent:#818cf8;--accent2:#38bdf8;--border:#263049;--code-bg:#070b16;--code-text:#e2e8f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151b2e;--text:#eef1f8;--muted:#a3adc4;--accent:#818cf8;--accent2:#38bdf8;--border:#263049;--code-bg:#070b16;--code-text:#e2e8f0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;transition:background .3s,color .3s}
.app{height:100%;display:flex;flex-direction:column;max-width:1000px;margin:0 auto;padding:0 16px}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.brand{font-weight:700;color:var(--accent)}
button{font:inherit;cursor:pointer;color:inherit}
.icon-btn{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:.9rem}
.icon-btn:hover{border-color:var(--accent)}
main{flex:1;overflow-y:auto;padding:8px 2px 16px}
.slide{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:clamp(18px,4vw,40px);animation:in .35s ease;border-top:6px solid var(--c,var(--accent))}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tag{display:inline-block;font-size:.8rem;font-weight:700;color:#fff;background:var(--c,var(--accent));padding:3px 12px;border-radius:999px;margin-bottom:10px}
h1{font-size:clamp(1.7rem,5vw,2.8rem);margin:.2em 0}
h2{font-size:clamp(1.4rem,4vw,2.1rem);margin:.1em 0 .4em}
.icon{font-size:3rem}
.sub{color:var(--muted);font-size:1.15rem}
.analogy{background:color-mix(in srgb,var(--c,var(--accent)) 12%,transparent);border-left:4px solid var(--c,var(--accent));padding:12px 16px;border-radius:10px;margin:14px 0}
ul.points{list-style:none;padding:0;margin:14px 0;display:grid;gap:10px}
ul.points li{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;display:flex;gap:10px}
ul.points li span:first-child{font-size:1.3rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.tab{background:var(--bg);border:1px solid var(--border);border-radius:10px 10px 0 0;padding:7px 14px;font-weight:600;font-size:.9rem}
.tab.on{background:var(--code-bg);color:var(--code-text);border-color:var(--code-bg)}
pre{margin:0;background:var(--code-bg);color:var(--code-text);padding:16px;border-radius:0 12px 12px 12px;overflow-x:auto;font:.9rem/1.5 ui-monospace,Menlo,Consolas,monospace}
.note{margin-top:10px;color:var(--muted)}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{border:1px solid var(--border);padding:10px 12px;text-align:left;vertical-align:top}
th{background:var(--bg)}
th.f{color:var(--front)}th.b{color:var(--back)}th.s{color:var(--full)}
.nav{display:flex;gap:8px}
.nav button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600}
.nav button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--border)}
.dot.on{background:var(--accent);transform:scale(1.3)}
@media (max-width:560px){.dots{display:none}footer{justify-content:space-between}}
</style>
</head>
<body>
<div class="app">
  <header><span class="brand">🧑‍💻 Aprende a programar</span><button class="icon-btn" id="theme" aria-label="Cambiar modo diurno o nocturno">🌙 Modo noche</button></header>
  <main id="stage" aria-live="polite"></main>
  <footer>
    <div class="nav"><button id="prev">← Anterior</button></div>
    <div class="dots" id="dots"></div>
    <div class="nav"><button id="next">Siguiente →</button></div>
  </footer>
</div>

<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const slides = DATA.slides;
const stage = document.getElementById("stage");
const dots = document.getElementById("dots");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const themeBtn = document.getElementById("theme");
let cur = 0;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function buildCode(codes) {
  const box = el("div");
  const tabs = el("div", "tabs");
  const pre = el("pre");
  const note = el("p", "note");
  const buttons = codes.map((c, i) => {
    const b = el("button", "tab", c.lang);
    b.onclick = () => show(i);
    tabs.appendChild(b);
    return b;
  });
  function show(i) {
    buttons.forEach((b, j) => b.classList.toggle("on", i === j));
    pre.textContent = codes[i].code;
    note.textContent = "💬 " + codes[i].note;
  }
  box.append(tabs, pre, note);
  show(0);
  return box;
}

function buildTable(t) {
  const wrap = el("div", "tablewrap");
  const table = el("table");
  const tr = el("tr");
  const cls = ["", "f", "b", "s"];
  t.head.forEach((h, i) => tr.appendChild(el("th", cls[i], h)));
  table.appendChild(tr);
  t.rows.forEach(r => {
    const row = el("tr");
    r.forEach((c, i) => row.appendChild(i === 0 ? el("th", "", c) : el("td", "", c)));
    table.appendChild(row);
  });
  wrap.appendChild(table);
  return wrap;
}

function render() {
  const s = slides[cur];
  const sl = el("section", "slide");
  if (s.color) sl.style.setProperty("--c", "var(" + s.color + ")");
  if (s.icon) sl.appendChild(el("div", "icon", s.icon));
  if (s.tag) sl.appendChild(el("div", "tag", s.tag));
  sl.appendChild(el(cur === 0 ? "h1" : "h2", "", s.title));
  if (s.sub) sl.appendChild(el("p", "sub", s.sub));
  if (s.text) sl.appendChild(el("p", "", s.text));
  if (s.analogy) sl.appendChild(el("div", "analogy", "🍽️ " + s.analogy));
  if (s.points) {
    const ul = el("ul", "points");
    s.points.forEach(p => {
      const li = el("li");
      li.append(el("span", "", p[0]), el("span", "", p[1]));
      ul.appendChild(li);
    });
    sl.appendChild(ul);
  }
  if (s.code) sl.appendChild(buildCode(s.code));
  if (s.table) sl.appendChild(buildTable(s.table));
  stage.replaceChildren(sl);
  stage.scrollTop = 0;
  prev.disabled = cur === 0;
  next.disabled = cur === slides.length - 1;
  [...dots.children].forEach((d, i) => d.classList.toggle("on", i === cur));
  try { history.replaceState(null, "", "#s" + (cur + 1)); } catch (e) {}
}

function go(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  render();
}

slides.forEach((s, i) => {
  const d = el("button", "dot");
  d.setAttribute("aria-label", "Ir a la diapositiva " + (i + 1));
  d.onclick = () => go(i);
  dots.appendChild(d);
});
prev.onclick = () => go(cur - 1);
next.onclick = () => go(cur + 1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown") go(cur + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") go(cur - 1);
});
let sx = null;
stage.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 70) go(cur + (dx < 0 ? 1 : -1));
  sx = null;
});

/* Tema día / noche */
const root = document.documentElement;
function isDark() {
  const t = root.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
function paintBtn() {
  themeBtn.textContent = isDark() ? "☀️ Modo día" : "🌙 Modo noche";
}
try {
  const saved = localStorage.getItem("tema");
  if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
} catch (e) {}
themeBtn.onclick = () => {
  const t = isDark() ? "light" : "dark";
  root.setAttribute("data-theme", t);
  try { localStorage.setItem("tema", t); } catch (e) {}
  paintBtn();
};
paintBtn();

const m = /^#s(\d+)$/.exec(location.hash);
go(m ? Number(m[1]) - 1 : 0);
</script>
</body>
